# Isolated local-only Supabase; run from testing/isolated (not repository root).
# Not linked to production; never use db push/pull/--linked in this directory.
project_id = "mama_i_malish_isolated_2026"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = [
  "http://127.0.0.1:5173",
  "http://localhost:5173",
  "http://127.0.0.1:4173",
  "http://localhost:4173"
]

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.external.google]
enabled = false

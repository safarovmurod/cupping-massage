name: Verify site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node --check testing/isolated/test-auth-crud.mjs
      - run: npm test
      - run: npm run build
        env:
          VITE_DEPLOY_STAGE: ci-mock
          VITE_SUPABASE_URL: https://ci-supabase.invalid
          VITE_SUPABASE_ANON_KEY: sb_publishable_ci_mock_1234567890
      - run: npm audit --audit-level=moderate

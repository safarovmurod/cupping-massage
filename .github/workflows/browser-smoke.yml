name: Static landing browser checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_PRODUCTION_ORIGIN: https://mama-i-malish-tj.pages.dev
      MAMA_SCREENSHOT_DIR: /tmp/mama-static-screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Start local preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/mama-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/mama-preview.log
          exit 1
      - run: python tests/browser/static-booking-smoke.py http://127.0.0.1:4173 2>&1 | tee /tmp/mama-booking-check.log
      - run: python tests/browser/static-experience.py http://127.0.0.1:4173 2>&1 | tee /tmp/mama-experience-check.log
      - run: npm install --prefix /tmp/mama-browser-tools --no-save --package-lock=false axe-core@4.10.3
      - run: python tests/browser/static-accessibility.py http://127.0.0.1:4173
        env:
          AXE_SCRIPT_PATH: /tmp/mama-browser-tools/node_modules/axe-core/axe.min.js
      - name: Report browser failure
        if: failure()
        run: |
          cat /tmp/mama-preview.log
          python - <<'PY'
          from pathlib import Path
          for filename in ("/tmp/mama-booking-check.log", "/tmp/mama-experience-check.log"):
              path = Path(filename)
              if path.exists() and "Traceback" in path.read_text():
                  text = path.read_text().split("Traceback", 1)[1][:12000]
                  text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print("::error title=Browser check failed::Traceback" + text)
          PY
      - name: Save screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mama-i-malish-static-browser-evidence
          path: /tmp/mama-static-screenshots/
          if-no-files-found: ignore
          retention-days: 7
